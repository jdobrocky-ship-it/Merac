<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merače – test databázy</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f2f2f2;
        color: #222;
    }

    header {
        background: #222;
        color: white;
        padding: 15px;
        text-align: center;
    }

    main {
        max-width: 900px;
        margin: auto;
        padding: 15px;
    }

    section {
        background: white;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 10px;
    }

    button {
        padding: 10px 14px;
        margin: 4px;
        border: 0;
        border-radius: 7px;
        cursor: pointer;
    }

    .primary {
        background: #1976d2;
        color: white;
    }

    .danger {
        background: #d32f2f;
        color: white;
    }

    .secondary {
        background: #ddd;
    }

    input, select {
        padding: 9px;
        margin: 4px;
        max-width: 100%;
    }

    .meter {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 10px;
        margin-top: 10px;
    }

    .photos {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .photo {
        width: 120px;
        border: 1px solid #ccc;
        border-radius: 7px;
        padding: 5px;
    }

    .photo img {
        width: 100%;
        height: 90px;
        object-fit: cover;
        border-radius: 5px;
    }

    #status {
        background: #fff8c4;
        padding: 10px;
        border-radius: 7px;
        margin-bottom: 15px;
    }

    pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #eee;
        padding: 10px;
        border-radius: 7px;
    }
</style>
</head>

<body>

<header>
    <h2>🔧 Merače – databázový test</h2>
</header>

<main>

<div id="status">Pripravené.</div>

<section>
    <h2>Úroveň</h2>

    <button class="primary" onclick="showLearning()">
        🔧 UČENIE
    </button>

    <button class="secondary" onclick="showUsage()">
        📷 POUŽITIE
    </button>
</section>

<section id="learning">
    <h2>🔧 Učenie</h2>

    <input id="newTypeName"
           placeholder="Názov typu, napr. Kamstrup 603">

    <button class="primary" onclick="createMeterType()">
        + Pridať typ merača
    </button>

    <div id="meterTypes"></div>
</section>

<section id="usage" style="display:none">
    <h2>📷 Použitie</h2>

    <p>
        Táto časť zatiaľ iba zobrazí typy uložené v databáze.
        Neskôr sem pridáme CLIP rozpoznávanie.
    </p>

    <div id="usageTypes"></div>
</section>

<section>
    <h2>💾 Záloha databázy</h2>

    <button class="primary" onclick="exportDatabase()">
        ⬇️ Exportovať ZIP
    </button>

    <input type="file"
           id="importFile"
           accept=".zip">

    <button class="primary" onclick="importDatabase()">
        ⬆️ Importovať ZIP
    </button>

    <br><br>

    <button class="danger" onclick="clearDatabase()">
        🗑 Vymazať CELÚ databázu
    </button>
</section>

<section>
    <h2>🧪 Stav databázy</h2>
    <pre id="dbInfo">Načítavam...</pre>
</section>

</main>

<!-- JSZip – iba na vytváranie ZIP zálohy -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>

/* =========================================================
   KONFIGURÁCIA
========================================================= */

const DB_NAME = "MeraceTestDB";
const DB_VERSION = 1;
const EMBEDDING_SIZE = 8;

let db;


/* =========================================================
   INDEXEDDB
========================================================= */

function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = event => {
            const database = event.target.result;

            if (!database.objectStoreNames.contains("meterTypes")) {
                database.createObjectStore("meterTypes", { keyPath: "id" });
            }

            if (!database.objectStoreNames.contains("photos")) {
                const store = database.createObjectStore("photos", { keyPath: "id" });
                store.createIndex("meterTypeId", "meterTypeId", { unique: false });
            }

            if (!database.objectStoreNames.contains("embeddings")) {
                const store = database.createObjectStore("embeddings", { keyPath: "id" });
                store.createIndex("photoId", "photoId", { unique: true });
                store.createIndex("meterTypeId", "meterTypeId", { unique: false });
            }

            if (!database.objectStoreNames.contains("prototypes")) {
                database.createObjectStore("prototypes", { keyPath: "meterTypeId" });
            }

            if (!database.objectStoreNames.contains("settings")) {
                database.createObjectStore("settings", { keyPath: "id" });
            }
        };

        request.onsuccess = event => {
            db = event.target.result;
            resolve(db);
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}


/* =========================================================
   POMOCNÉ FUNKCIE
========================================================= */

function id() {
    return crypto.randomUUID();
}

function setStatus(text) {
    document.getElementById("status").textContent = text;
}

function transaction(storeNames, mode = "readonly") {
    return db.transaction(storeNames, mode);
}


/* =========================================================
   GENEROVANIE TESTOVACIEHO EMBEDDINGU
========================================================= */

function createTestEmbedding() {
    const vector = [];
    for (let i = 0; i < EMBEDDING_SIZE; i++) {
        vector.push(Math.random());
    }
    return normalize(vector);
}

function normalize(vector) {
    let sum = 0;
    for (const value of vector) {
        sum += value * value;
    }
    const length = Math.sqrt(sum);
    if (length === 0) return vector;
    return vector.map(value => value / length);
}

function averageVectors(vectors) {
    if (!vectors.length) return null;
    const result = new Array(vectors[0].length).fill(0);
    for (const vector of vectors) {
        for (let i = 0; i < vector.length; i++) {
            result[i] += vector[i];
        }
    }
    for (let i = 0; i < result.length; i++) {
        result[i] /= vectors.length;
    }
    return normalize(result);
}


/* =========================================================
   PRÁCA S DATABÁZOU
========================================================= */

function getAll(storeName) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const request = store.getAll();

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

function put(storeName, data) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).put(data);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}

function deleteRecord(storeName, key) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}


/* =========================================================
   VYTVORENIE TYPU MERAČA
========================================================= */

async function createMeterType() {
    const input = document.getElementById("newTypeName");
    const name = input.value.trim();

    if (!name) {
        alert("Zadaj názov typu merača.");
        return;
    }

    const meterType = {
        id: "meter-" + id(),
        name: name,
        manufacturer: "",
        model: "",
        created: new Date().toISOString(),
        referencePhotoId: null,
        ocrRegions: {
            serialNumber: null,
            nominalFlow: null,
            meterStatus: null
        }
    };

    await put("meterTypes", meterType);
    input.value = "";
    setStatus("Vytvorený typ: " + name);
    refreshUI();
}


/* =========================================================
   ÚPRAVA NÁZVU
========================================================= */

async function editMeterType(meterTypeId) {
    const types = await getAll("meterTypes");
    const type = types.find(x => x.id === meterTypeId);
    if (!type) return;

    const newName = prompt("Nový názov typu:", type.name);
    if (newName === null) return;

    const trimmed = newName.trim();
    if (!trimmed) return;

    type.name = trimmed;
    await put("meterTypes", type);
    setStatus("Názov bol upravený.");
    refreshUI();
}


/* =========================================================
   PRIDANIE FOTOGRAFIÍ
========================================================= */

async function addPhotos(meterTypeId) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.multiple = true;

    input.onchange = async () => {
        const files = Array.from(input.files);
        if (!files.length) return;

        setStatus("Pridávam " + files.length + " fotografií...");

        for (const file of files) {
            const photoId = id();

            const photo = {
                id: photoId,
                meterTypeId: meterTypeId,
                blob: file,
                fileName: file.name,
                created: new Date().toISOString()
            };

            await put("photos", photo);

            const embedding = {
                id: "emb-" + photoId,
                photoId: photoId,
                meterTypeId: meterTypeId,
                vector: createTestEmbedding(),
                created: new Date().toISOString()
            };

            await put("embeddings", embedding);
        }

        await rebuildPrototype(meterTypeId);
        setStatus("Fotografie boli pridané.");
        refreshUI();
        
        // Zabezpečí, že po pridaní ostanú fotky viditeľné
        const photosDiv = document.getElementById("photos-" + meterTypeId);
        if (photosDiv) {
            photosDiv.style.display = "block";
            await showPhotos(meterTypeId);
        }
    };

    input.click();
}


/* =========================================================
   PREPOČÍTANIE PROTOTYPU
========================================================= */

async function rebuildPrototype(meterTypeId) {
    const embeddings = await getAll("embeddings");
    const vectors = embeddings
        .filter(x => x.meterTypeId === meterTypeId)
        .map(x => x.vector);

    if (!vectors.length) {
        await deleteRecord("prototypes", meterTypeId);
        return;
    }

    const prototype = averageVectors(vectors);
    await put("prototypes", {
        meterTypeId: meterTypeId,
        vector: prototype,
        count: vectors.length,
        updated: new Date().toISOString()
    });
}


/* =========================================================
   ZOBRAZENIE FOTOGRAFIÍ (Opravený Memory Leak)
========================================================= */

async function showPhotos(meterTypeId) {
    const container = document.getElementById("photos-" + meterTypeId);
    if (!container) return;

    // ODSTRÁNENIE MEMORY LEAKU: Uvoľnenie starých Blob URL z pamäte
    const oldImgs = container.querySelectorAll("img");
    oldImgs.forEach(img => {
        if (img.src.startsWith("blob:")) {
            URL.revokeObjectURL(img.src);
        }
    });

    container.innerHTML = "";

    const photos = await getAll("photos");
    const filtered = photos.filter(x => x.meterTypeId === meterTypeId);

    if (!filtered.length) {
        container.textContent = "Žiadne fotografie.";
        return;
    }

    const wrapper = document.createElement("div");
    wrapper.className = "photos";

    for (const photo of filtered) {
        const div = document.createElement("div");
        div.className = "photo";

        const img = document.createElement("img");
        img.src = URL.createObjectURL(photo.blob);

        const text = document.createElement("div");
        text.textContent = photo.fileName;

        const button = document.createElement("button");
        button.className = "danger";
        button.textContent = "🗑";
        button.onclick = () => deletePhoto(photo.id, meterTypeId);

        div.appendChild(img);
        div.appendChild(text);
        div.appendChild(button);

        wrapper.appendChild(div);
    }

    container.appendChild(wrapper);
}


/* =========================================================
   VYMAZANIE FOTOGRAFIE
========================================================= */

async function deletePhoto(photoId, meterTypeId) {
    const answer = confirm(
        "Naozaj chceš vymazať túto fotografiu?\n\n" +
        "Vymaže sa aj jej embedding a prototype sa prepočíta."
    );

    if (!answer) return;

    const embeddings = await getAll("embeddings");
    const embedding = embeddings.find(x => x.photoId === photoId);

    if (embedding) {
        await deleteRecord("embeddings", embedding.id);
    }

    await deleteRecord("photos", photoId);
    await rebuildPrototype(meterTypeId);

    setStatus("Fotografia bola odstránená.");
    
    // Obnovíme UI a zachováme otvorený zoznam fotografií
    await refreshUI();
    const photosDiv = document.getElementById("photos-" + meterTypeId);
    if (photosDiv) {
        photosDiv.style.display = "block";
        await showPhotos(meterTypeId);
    }
}


/* =========================================================
   VYMAZANIE TYPU
========================================================= */

async function deleteMeterType(meterTypeId) {
    const types = await getAll("meterTypes");
    const type = types.find(x => x.id === meterTypeId);
    if (!type) return;

    const answer = confirm(
        "POZOR!\n\n" +
        "Vymazaním typu \"" + type.name + "\" sa odstránia:\n\n" +
        "• všetky fotografie\n" +
        "• embeddingy\n" +
        "• prototype\n" +
        "• OCR nastavenia\n\n" +
        "Naozaj pokračovať?"
    );

    if (!answer) return;

    const photos = await getAll("photos");
    for (const photo of photos) {
        if (photo.meterTypeId === meterTypeId) {
            await deleteRecord("photos", photo.id);
        }
    }

    const embeddings = await getAll("embeddings");
    for (const embedding of embeddings) {
        if (embedding.meterTypeId === meterTypeId) {
            await deleteRecord("embeddings", embedding.id);
        }
    }

    await deleteRecord("prototypes", meterTypeId);
    await deleteRecord("meterTypes", meterTypeId);

    setStatus("Typ merača bol vymazaný.");
    refreshUI();
}


/* =========================================================
   VYKRESLENIE UČENIA
========================================================= */

async function renderLearning() {
    const container = document.getElementById("meterTypes");
    container.innerHTML = "";

    const types = await getAll("meterTypes");
    const photos = await getAll("photos");
    const prototypes = await getAll("prototypes");

    if (!types.length) {
        container.innerHTML = "<p>Žiadne naučené typy.</p>";
        return;
    }

    for (const type of types) {
        const count = photos.filter(x => x.meterTypeId === type.id).length;
        const prototype = prototypes.find(x => x.meterTypeId === type.id);

        const div = document.createElement("div");
        div.className = "meter";

        div.innerHTML = `
            <h3>${escapeHTML(type.name)}</h3>
            <p>ID: <small>${type.id}</small></p>
            <p>🖼 Naučené fotografie: <strong>${count}</strong></p>
            <p>🧠 Prototype: ${prototype ? "✓ vytvorený" : "–"}</p>

            <button class="primary" onclick="addPhotos('${type.id}')">+ Pridať fotografie</button>
            <button class="secondary" onclick="editMeterType('${type.id}')">✏️ Upraviť názov</button>
            <button class="secondary" onclick="togglePhotos('${type.id}')">🖼 Fotografie</button>
            <button class="danger" onclick="deleteMeterType('${type.id}')">🗑 Vymazať typ</button>

            <div id="photos-${type.id}" style="display:none;margin-top:10px"></div>
        `;

        container.appendChild(div);
    }
}


async function togglePhotos(meterTypeId) {
    const div = document.getElementById("photos-" + meterTypeId);
    if (!div) return;

    if (div.style.display === "none") {
        div.style.display = "block";
        await showPhotos(meterTypeId);
    } else {
        div.style.display = "none";
    }
}


/* =========================================================
   POUŽITIE
========================================================= */

async function renderUsage() {
    const container = document.getElementById("usageTypes");
    container.innerHTML = "";

    const types = await getAll("meterTypes");

    if (!types.length) {
        container.textContent = "Zatiaľ nie sú naučené žiadne typy.";
        return;
    }

    for (const type of types) {
        const div = document.createElement("div");
        div.className = "meter";
        div.innerHTML = `
            <strong>${escapeHTML(type.name)}</strong><br>
            ID: ${type.id}
        `;
        container.appendChild(div);
    }
}


/* =========================================================
   UI PREPÍNANIE
========================================================= */

function showLearning() {
    document.getElementById("learning").style.display = "block";
    document.getElementById("usage").style.display = "none";
}

async function showUsage() {
    document.getElementById("learning").style.display = "none";
    document.getElementById("usage").style.display = "block";
    await renderUsage();
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {
    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   INFORMÁCIE O DATABÁZE
========================================================= */

async function updateDBInfo() {
    const types = await getAll("meterTypes");
    const photos = await getAll("photos");
    const embeddings = await getAll("embeddings");
    const prototypes = await getAll("prototypes");

    const info = {
        meterTypes: types.length,
        photos: photos.length,
        embeddings: embeddings.length,
        prototypes: prototypes.length,
        database: DB_NAME,
        version: DB_VERSION
    };

    document.getElementById("dbInfo").textContent = JSON.stringify(info, null, 2);
}


/* =========================================================
   EXPORT
========================================================= */

async function exportDatabase() {
    setStatus("Pripravujem ZIP zálohu...");

    const types = await getAll("meterTypes");
    const photos = await getAll("photos");
    const embeddings = await getAll("embeddings");
    const prototypes = await getAll("prototypes");

    const zip = new JSZip();

    const manifest = {
        version: 1,
        database: DB_NAME,
        exported: new Date().toISOString(),
        embeddingSize: EMBEDDING_SIZE,
        counts: {
            meterTypes: types.length,
            photos: photos.length,
            embeddings: embeddings.length,
            prototypes: prototypes.length
        }
    };

    zip.file("manifest.json", JSON.stringify(manifest, null, 2));
    zip.file("meterTypes.json", JSON.stringify(types, null, 2));
    zip.file("embeddings.json", JSON.stringify(embeddings, null, 2));
    zip.file("prototypes.json", JSON.stringify(prototypes, null, 2));

    const photoManifest = [];

    for (const photo of photos) {
        const extension = getExtension(photo.fileName);
        const path = "photos/" + photo.id + extension;

        zip.file(path, photo.blob);

        photoManifest.push({
            id: photo.id,
            meterTypeId: photo.meterTypeId,
            fileName: photo.fileName,
            path: path,
            created: photo.created
        });
    }

    zip.file("photos.json", JSON.stringify(photoManifest, null, 2));

    const blob = await zip.generateAsync({ type: "blob" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "merace-backup-" + new Date().toISOString().slice(0, 10) + ".zip";
    a.click();

    URL.revokeObjectURL(url);
    setStatus("ZIP záloha bola vytvorená.");
}


/* =========================================================
   IMPORT
========================================================= */

async function importDatabase() {
    const input = document.getElementById("importFile");
    const file = input.files[0];

    if (!file) {
        alert("Najprv vyber ZIP súbor.");
        return;
    }

    const answer = confirm("Import nahradí aktuálne údaje v databáze.\n\nPokračovať?");
    if (!answer) return;

    setStatus("Načítavam ZIP...");

    try {
        const zip = await JSZip.loadAsync(file);

        const types = JSON.parse(await zip.file("meterTypes.json").async("string"));
        const embeddings = JSON.parse(await zip.file("embeddings.json").async("string"));
        const prototypes = JSON.parse(await zip.file("prototypes.json").async("string"));
        const photoManifest = JSON.parse(await zip.file("photos.json").async("string"));

        await clearDatabase(false);

        for (const type of types) await put("meterTypes", type);
        for (const embedding of embeddings) await put("embeddings", embedding);
        for (const prototype of prototypes) await put("prototypes", prototype);

        for (const item of photoManifest) {
            const zipFile = zip.file(item.path);
            if (!zipFile) continue;

            const blob = await zipFile.async("blob");
            await put("photos", {
                id: item.id,
                meterTypeId: item.meterTypeId,
                blob: blob,
                fileName: item.fileName,
                created: item.created
            });
        }

        setStatus("Import dokončený.");
        input.value = ""; // Vyčistenie inputu pre opakovaný import
        refreshUI();
    } catch (err) {
        console.error(err);
        setStatus("Chyba pri importe ZIP súboru.");
    }
}


/* =========================================================
   VYMAZANIE CELEJ DATABÁZY
========================================================= */

async function clearDatabase(ask = true) {
    if (ask) {
        const answer = confirm("Naozaj vymazať CELÚ databázu?");
        if (!answer) return;
    }

    const stores = ["meterTypes", "photos", "embeddings", "prototypes", "settings"];
    const tx = db.transaction(stores, "readwrite");

    for (const store of stores) {
        tx.objectStore(store).clear();
    }

    await new Promise((resolve, reject) => {
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });

    setStatus("Databáza bola vymazaná.");
    refreshUI();
}


/* =========================================================
   PRÍPONA SÚBORU
========================================================= */

function getExtension(filename) {
    const index = filename.lastIndexOf(".");
    if (index === -1) return ".jpg";
    return filename.slice(index).toLowerCase();
}


/* =========================================================
   OBNOVA UI
========================================================= */

async function refreshUI() {
    if (!db) return;
    await renderLearning();
    await renderUsage();
    await updateDBInfo();
}


/* =========================================================
   SPUSTENIE (Opravené asynchrónne volanie)
========================================================= */

openDB()
    .then(() => {
        refreshUI();
    })
    .catch(error => {
        console.error(error);
        setStatus("Chyba databázy: " + error.message);
    });

</script>

</body>
</html>
